<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>二手闲置 · 邻里宠帮</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: { colors: { cream: "#fff8f1", peach: "#f4a261", coral: "#e07a5f", mint: "#6bb3a8", sage: "#3d7a72", ink: "#2f3e46" } } }
    };
  </script>
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <div class="app-shell page-pad">
    <header class="px-5 pt-6 pb-3 flex items-center justify-between">
      <a href="index.html" class="text-sm text-sage">‹ 返回</a>
      <h1 class="text-lg font-semibold">二手闲置</h1>
      <a href="publish-goods.html" class="text-sm text-coral">发布</a>
    </header>

    <div class="px-5 mb-4">
      <label class="block text-xs text-slate-500 mb-1">分类筛选</label>
      <select id="goodsFilter" class="w-full rounded-xl border border-orange-100 bg-white px-3 py-2.5 text-sm outline-none">
        <option value="all">全部分类</option>
        <option value="food">宠物主粮</option>
        <option value="cage">笼子猫砂</option>
        <option value="toy">玩具用品</option>
        <option value="wear">穿戴用品</option>
        <option value="other">其他</option>
      </select>
    </div>

    <div class="px-5 grid grid-cols-2 gap-3">
      <a href="goods-detail.html" data-category="toy" class="bg-white rounded-2xl overflow-hidden shadow-sm border border-orange-50">
        <div class="h-28 placeholder text-3xl">🧸</div>
        <div class="p-3">
          <h2 class="text-sm font-semibold truncate">猫爬架（九成新）</h2>
          <p class="text-coral font-semibold mt-1">¥68</p>
          <p class="text-[11px] text-slate-400 mt-1">玩具用品</p>
        </div>
      </a>
      <a href="goods-detail.html" data-category="food" class="bg-white rounded-2xl overflow-hidden shadow-sm border border-orange-50">
        <div class="h-28 placeholder text-3xl">🥫</div>
        <div class="p-3">
          <h2 class="text-sm font-semibold truncate">未开封成猫粮 2kg</h2>
          <p class="text-coral font-semibold mt-1">¥45</p>
          <p class="text-[11px] text-slate-400 mt-1">宠物主粮</p>
        </div>
      </a>
      <a href="goods-detail.html" data-category="cage" class="bg-white rounded-2xl overflow-hidden shadow-sm border border-orange-50">
        <div class="h-28 placeholder text-3xl">📦</div>
        <div class="p-3">
          <h2 class="text-sm font-semibold truncate">折叠航空箱</h2>
          <p class="text-coral font-semibold mt-1">¥80</p>
          <p class="text-[11px] text-slate-400 mt-1">笼子猫砂</p>
        </div>
      </a>
      <a href="goods-detail.html" data-category="wear" class="bg-white rounded-2xl overflow-hidden shadow-sm border border-orange-50">
        <div class="h-28 placeholder text-3xl">🎀</div>
        <div class="p-3">
          <h2 class="text-sm font-semibold truncate">牵引绳套装</h2>
          <p class="text-coral font-semibold mt-1">¥22</p>
          <p class="text-[11px] text-slate-400 mt-1">穿戴用品</p>
        </div>
      </a>
      <a href="goods-detail.html" data-category="other" class="bg-white rounded-2xl overflow-hidden shadow-sm border border-orange-50">
        <div class="h-28 placeholder text-3xl">🧴</div>
        <div class="p-3">
          <h2 class="text-sm font-semibold truncate">宠物沐浴露余量</h2>
          <p class="text-coral font-semibold mt-1">¥12</p>
          <p class="text-[11px] text-slate-400 mt-1">其他</p>
        </div>
      </a>
      <a href="goods-detail.html" data-category="cage" class="bg-white rounded-2xl overflow-hidden shadow-sm border border-orange-50">
        <div class="h-28 placeholder text-3xl">🧻</div>
        <div class="p-3">
          <h2 class="text-sm font-semibold truncate">豆腐猫砂 6L</h2>
          <p class="text-coral font-semibold mt-1">¥18</p>
          <p class="text-[11px] text-slate-400 mt-1">笼子猫砂</p>
        </div>
      </a>
    </div>

    <nav class="bottom-nav bg-white/95 backdrop-blur border-t border-orange-100 px-2 py-2">
      <div class="grid grid-cols-5 text-[11px] text-slate-400">
        <a href="index.html" class="tab-item flex flex-col items-center gap-0.5 py-1"><span class="text-lg">🏠</span>首页</a>
        <a href="find-pet.html" class="tab-item flex flex-col items-center gap-0.5 py-1"><span class="text-lg">🔎</span>寻宠</a>
        <a href="help-list.html" class="tab-item flex flex-col items-center gap-0.5 py-1"><span class="text-lg">🤝</span>互助</a>
        <a href="goods-list.html" class="tab-item active flex flex-col items-center gap-0.5 py-1"><span class="text-lg">🛒</span>闲置</a>
        <a href="mine.html" class="tab-item flex flex-col items-center gap-0.5 py-1"><span class="text-lg">👤</span>我的</a>
      </div>
    </nav>

  <script src="js/app.js"></script>

</html>
