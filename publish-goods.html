<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>发布闲置 · 邻里宠帮</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: { colors: { cream: "#fff8f1", peach: "#f4a261", coral: "#e07a5f", mint: "#6bb3a8", sage: "#3d7a72", ink: "#2f3e46" } } }
    };
  </script>
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <div class="app-shell page-pad">
    <header class="px-5 pt-6 pb-4 flex items-center justify-between">
      <a href="goods-list.html" class="text-sm text-sage">‹ 返回</a>
      <h1 class="text-lg font-semibold">发布闲置</h1>
      <span class="w-10"></span>
    </header>

    <form class="px-5 space-y-4" data-success="商品发布提交成功" data-redirect="goods-list.html">
      <label class="block">
        <span class="text-sm font-medium">商品名称</span>
        <input required name="name" placeholder="请输入商品名称" class="mt-1 w-full rounded-xl border border-orange-100 bg-white px-3 py-2.5 text-sm outline-none focus:border-mint" />
      </label>
      <label class="block">
        <span class="text-sm font-medium">商品分类</span>
        <select required name="category" class="mt-1 w-full rounded-xl border border-orange-100 bg-white px-3 py-2.5 text-sm outline-none">
          <option value="">请选择分类</option>
          <option>宠物主粮</option>
          <option>笼子猫砂</option>
          <option>玩具用品</option>
          <option>穿戴用品</option>
          <option>其他</option>
        </select>
      </label>
      <label class="block">
        <span class="text-sm font-medium">价格（元）</span>
        <input required type="number" min="0" step="0.01" name="price" placeholder="例如：68" class="mt-1 w-full rounded-xl border border-orange-100 bg-white px-3 py-2.5 text-sm outline-none focus:border-mint" />
      </label>
      <label class="block">
        <span class="text-sm font-medium">新旧程度</span>
        <select required name="condition" class="mt-1 w-full rounded-xl border border-orange-100 bg-white px-3 py-2.5 text-sm outline-none">
          <option value="">请选择</option>
          <option>全新未拆</option>
          <option>九成新</option>
          <option>八成新</option>
          <option>使用痕迹明显</option>
        </select>
      </label>
      <label class="block">
        <span class="text-sm font-medium">商品描述</span>
        <textarea required name="desc" rows="4" placeholder="品牌、规格、使用情况、自提地点等" class="mt-1 w-full rounded-xl border border-orange-100 bg-white px-3 py-2.5 text-sm outline-none focus:border-mint resize-none"></textarea>
      </label>
      <label class="block">
        <span class="text-sm font-medium">交易地点</span>
        <input required name="place" placeholder="小区、街道或地标" class="mt-1 w-full rounded-xl border border-orange-100 bg-white px-3 py-2.5 text-sm outline-none focus:border-mint" />
      </label>
      <label class="block">
        <span class="text-sm font-medium">联系方式</span>
        <input required name="contact" placeholder="手机号 / 微信" class="mt-1 w-full rounded-xl border border-orange-100 bg-white px-3 py-2.5 text-sm outline-none focus:border-mint" />
      </label>
      <div>
        <span class="text-sm font-medium">商品图片</span>
        <button type="button" data-upload class="mt-1 w-full h-32 rounded-2xl border border-dashed border-peach/70 placeholder text-sm">📷 点击添加照片（占位）</button>
      </div>
      <button type="submit" class="w-full py-3 rounded-2xl bg-coral text-white font-medium">提交发布</button>
    </form>

    <nav class="bottom-nav bg-white/95 backdrop-blur border-t border-orange-100 px-2 py-2">
      <div class="grid grid-cols-5 text-[11px] text-slate-400">
        <a href="index.html" class="tab-item flex flex-col items-center gap-0.5 py-1"><span class="text-lg">🏠</span>首页</a>
        <a href="find-pet.html" class="tab-item flex flex-col items-center gap-0.5 py-1"><span class="text-lg">🔎</span>寻宠</a>
        <a href="help-list.html" class="tab-item flex flex-col items-center gap-0.5 py-1"><span class="text-lg">🤝</span>互助</a>
        <a href="goods-list.html" class="tab-item active flex flex-col items-center gap-0.5 py-1"><span class="text-lg">🛒</span>闲置</a>
        <a href="mine.html" class="tab-item flex flex-col items-center gap-0.5 py-1"><span class="text-lg">👤</span>我的</a>
      </div>
    </nav>
  </div>
  <script src="js/app.js"></script>
</body>
</html>
