<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>我的收藏 · 邻里宠帮</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <div class="app-shell page-pad">
    <header class="px-5 pt-6 pb-4 flex items-center justify-between">
      <a href="mine.html" class="text-sm text-sage">‹ 返回</a>
      <h1 class="text-lg font-semibold">我的收藏</h1>
      <span class="w-10"></span>
    </header>

    <div class="px-5">
      <div class="grid grid-cols-3 gap-2 rounded-xl bg-white p-1 text-center text-sm shadow-sm">
        <button class="rounded-lg bg-peach py-2 text-white">全部</button>
        <button class="rounded-lg py-2 text-slate-500" data-toast="已切换到商品收藏">商品</button>
        <button class="rounded-lg py-2 text-slate-500" data-toast="已切换到互助收藏">互助</button>
      </div>
    </div>

    <section class="px-5 mt-5 space-y-3">
      <a href="goods-detail.html?from=favorites" class="flex gap-3 rounded-2xl bg-white p-3 shadow-sm border border-orange-50">
        <div class="w-20 h-20 rounded-xl placeholder text-3xl shrink-0">🧸</div>
        <div class="min-w-0 flex-1">
          <p class="text-sm font-semibold">猫爬架（九成新）</p>
          <p class="text-coral font-semibold mt-1">¥68</p>
          <p class="text-xs text-slate-500 mt-1">玩具用品 · 梧桐里自提</p>
        </div>
        <span class="text-slate-300">›</span>
      </a>
      <button type="button" data-toast="已打开互助收藏详情" class="w-full flex gap-3 rounded-2xl bg-white p-3 shadow-sm border border-teal-50 text-left">
        <div class="w-20 h-20 rounded-xl placeholder text-3xl shrink-0">🐱</div>
        <div class="min-w-0 flex-1">
          <p class="text-sm font-semibold">林阿姨求周末帮带布偶猫</p>
          <p class="text-xs text-slate-500 mt-1">寄养时间 9.20 - 9.22</p>
          <p class="text-xs text-slate-500 mt-1">阳光花园 · 待报名</p>
        </div>
        <span class="text-slate-300">›</span>
      </button>
      <button type="button" data-toast="已打开寻宠收藏详情" class="w-full flex gap-3 rounded-2xl bg-white p-3 shadow-sm border border-orange-50 text-left">
        <div class="w-20 h-20 rounded-xl placeholder text-3xl shrink-0">🐰</div>
        <div class="min-w-0 flex-1">
          <p class="text-sm font-semibold">云朵 · 寻找中</p>
          <p class="text-xs text-slate-500 mt-1">垂耳兔 · 梧桐里小区北门</p>
          <p class="text-xs text-slate-500 mt-1">收藏于 9.19</p>
        </div>
        <span class="text-slate-300">›</span>
      </button>
    </section>

    <nav class="bottom-nav bg-white/95 backdrop-blur border-t border-orange-100 px-2 py-2">
      <div class="grid grid-cols-5 text-[11px] text-slate-400">
        <a href="index.html" class="tab-item flex flex-col items-center gap-0.5 py-1"><span class="text-lg">🏠</span>首页</a>
        <a href="find-pet.html" class="tab-item flex flex-col items-center gap-0.5 py-1"><span class="text-lg">🔎</span>寻宠</a>
        <a href="help-list.html" class="tab-item flex flex-col items-center gap-0.5 py-1"><span class="text-lg">🤝</span>互助</a>
        <a href="goods-list.html" class="tab-item flex flex-col items-center gap-0.5 py-1"><span class="text-lg">🛒</span>闲置</a>
        <a href="mine.html" class="tab-item active flex flex-col items-center gap-0.5 py-1"><span class="text-lg">👤</span>我的</a>
      </div>
    </nav>
  </div>
  <script src="js/app.js"></script>
</body>
</html>
