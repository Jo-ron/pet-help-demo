<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>发布寻宠 · 邻里宠帮</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: { colors: { cream: "#fff8f1", peach: "#f4a261", coral: "#e07a5f", mint: "#6bb3a8", sage: "#3d7a72", ink: "#2f3e46" } } }
    };
  </script>
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <div class="app-shell page-pad">
    <header class="px-5 pt-6 pb-4 flex items-center justify-between">
      <a href="find-pet.html" class="text-sm text-sage">‹ 返回</a>
      <h1 class="text-lg font-semibold">发布寻宠</h1>
      <span class="w-10"></span>
    </header>

    <form class="px-5 space-y-4" data-success="寻宠启事提交成功" data-redirect="find-pet.html" data-save-find>
      <label class="block">
        <span class="text-sm font-medium">宠物名称</span>
        <input required name="name" placeholder="例如：奶盖" class="mt-1 w-full rounded-xl border border-orange-100 bg-white px-3 py-2.5 text-sm outline-none focus:border-mint" />
      </label>
      <label class="block">
        <span class="text-sm font-medium">品种</span>
        <input required name="breed" placeholder="例如：橘猫 / 柯基" class="mt-1 w-full rounded-xl border border-orange-100 bg-white px-3 py-2.5 text-sm outline-none focus:border-mint" />
      </label>
      <label class="block">
        <span class="text-sm font-medium">性别、年龄</span>
        <input name="age" placeholder="如：女，3个月" class="mt-1 w-full rounded-xl border border-orange-100 bg-white px-3 py-2.5 text-sm outline-none focus:border-mint" />
      </label>
      <label class="block">
        <span class="text-sm font-medium">走失时间</span>
        <input required type="date" name="lostTime" class="mt-1 w-full rounded-xl border border-orange-100 bg-white px-3 py-2.5 text-sm outline-none focus:border-mint" />
      </label>
      <label class="block">
        <span class="text-sm font-medium">走失地点</span>
        <input required name="place" placeholder="小区 / 街道 / 地标" class="mt-1 w-full rounded-xl border border-orange-100 bg-white px-3 py-2.5 text-sm outline-none focus:border-mint" />
      </label>
      <label class="block">
        <span class="text-sm font-medium">外貌特征</span>
        <input required name="appearance" placeholder="毛色、体型、特殊标记" class="mt-1 w-full rounded-xl border border-orange-100 bg-white px-3 py-2.5 text-sm outline-none focus:border-mint" />
      </label>
      <label class="block">
        <span class="text-sm font-medium">悬赏说明</span>
        <input name="reward" placeholder="选填" class="mt-1 w-full rounded-xl border border-orange-100 bg-white px-3 py-2.5 text-sm outline-none focus:border-mint" />
      </label>
      <label class="block">
        <span class="text-sm font-medium">联系说明</span>
        <input name="contactNote" placeholder="选填" class="mt-1 w-full rounded-xl border border-orange-100 bg-white px-3 py-2.5 text-sm outline-none focus:border-mint" />
      </label>
      <div>
        <span class="text-sm font-medium">上传图片</span>
        <button type="button" data-upload class="mt-1 w-full h-32 rounded-2xl border border-dashed border-peach/70 placeholder text-sm">📷 点击添加照片（占位）</button>
      </div>
      <label class="block">
        <span class="text-sm font-medium">联系方式</span>
        <input required name="contact" placeholder="手机号 / 微信" class="mt-1 w-full rounded-xl border border-orange-100 bg-white px-3 py-2.5 text-sm outline-none focus:border-mint" />
      </label>
      <button type="submit" class="w-full py-3 rounded-2xl bg-coral text-white font-medium">提交发布</button>
    </form>

    <nav class="bottom-nav bg-white/95 backdrop-blur border-t border-orange-100 px-2 py-2">
      <div class="grid grid-cols-5 text-[11px] text-slate-400">
        <a href="index.html" class="tab-item flex flex-col items-center gap-0.5 py-1"><span class="text-lg">🏠</span>首页</a>
        <a href="find-pet.html" class="tab-item active flex flex-col items-center gap-0.5 py-1"><span class="text-lg">🔎</span>寻宠</a>
        <a href="help-list.html" class="tab-item flex flex-col items-center gap-0.5 py-1"><span class="text-lg">🤝</span>互助</a>
        <a href="goods-list.html" class="tab-item flex flex-col items-center gap-0.5 py-1"><span class="text-lg">🛒</span>闲置</a>
        <a href="mine.html" class="tab-item flex flex-col items-center gap-0.5 py-1"><span class="text-lg">👤</span>我的</a>
      </div>
    </nav>
  </div>
  <script src="js/app.js"></script>
</body>
</html>
